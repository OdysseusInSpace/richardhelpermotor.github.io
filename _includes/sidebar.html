<div class="sidebar">
  <div class="container sidebar-sticky">
    <div class="sidebar-about">
      <h1>
        <a href="https://odysseusinspace.github.io/richardhelpermotor.github.io">
          {{ site.title }}
        </a>
      </h1>
      <p class="lead">{{ site.description }}</p>
    </div>

    <nav class="sidebar-nav">
      <a class="sidebar-nav-item{% if page.title == "Home" %} active{% endif %}" 
         href="https://odysseusinspace.github.io/richardhelpermotor.github.io">
        Home
      </a>

      {% if site.posts.size > 0 %}
        <a class="sidebar-nav-item" 
           href="{{ site.posts.first.url | absolute_url }}">
          Most Recent Test
        </a>
      {% endif %}
    </nav>
  </div>
</div>
